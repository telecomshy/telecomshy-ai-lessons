<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="编排时序图：用户把大任务交给 lead（编排者），lead 拆活派单给 worker A、B、C 三路并行，派单带目标、输出格式、工具与来源、边界四件；每个 worker 自己转循环、流水留在自己那，干完各回一条结论；lead 汇总成一个答案交回用户。worker 失败由 lead 重派、换工具、降级。">
  <defs>
    <marker id="os-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
    <marker id="os-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b3a"/>
    </marker>
    <marker id="os-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9b1c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#fdfcf8"/>

  <!-- 用户 -->
  <rect x="25" y="200" width="150" height="64" rx="8" fill="#f4e9e2" stroke="#8a2b06" stroke-width="1.5"/>
  <text x="100" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a2b06">用户</text>

  <!-- lead -->
  <rect x="330" y="150" width="180" height="164" rx="8" fill="#f4e9e2" stroke="#8a2b06" stroke-width="1.6"/>
  <text x="348" y="182" font-family="sans-serif" font-size="15" fill="#8a2b06">lead（编排者）</text>
  <text x="348" y="212" font-family="sans-serif" font-size="12.5" fill="#1b1a17">拆活、派单、汇总</text>
  <text x="348" y="238" font-family="sans-serif" font-size="12.5" fill="#1b1a17">自己几乎不动手</text>
  <text x="348" y="264" font-family="sans-serif" font-size="12.5" fill="#1b1a17">谁失败了，重派</text>
  <text x="348" y="290" font-family="sans-serif" font-size="12.5" fill="#6c675e">换工具、降级也在这一层</text>

  <!-- workers -->
  <rect x="640" y="80" width="230" height="76" rx="8" fill="#fff" stroke="#1f6b3a" stroke-width="1.5"/>
  <text x="656" y="106" font-family="sans-serif" font-size="13.5" fill="#1f6b3a">worker A</text>
  <text x="656" y="132" font-family="sans-serif" font-size="12" fill="#6c675e">自己转循环，流水留自己那</text>

  <rect x="640" y="196" width="230" height="76" rx="8" fill="#fff" stroke="#1f6b3a" stroke-width="1.5"/>
  <text x="656" y="222" font-family="sans-serif" font-size="13.5" fill="#1f6b3a">worker B</text>
  <text x="656" y="248" font-family="sans-serif" font-size="12" fill="#6c675e">一个干净上下文，啃自己那块</text>

  <rect x="640" y="312" width="230" height="76" rx="8" fill="#fff" stroke="#1f6b3a" stroke-width="1.5"/>
  <text x="656" y="338" font-family="sans-serif" font-size="13.5" fill="#1f6b3a">worker C</text>
  <text x="656" y="364" font-family="sans-serif" font-size="12" fill="#6c675e">和其他 worker 互不相认</text>

  <!-- ① 用户 → lead -->
  <text x="252" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#6c675e">①</text>
  <line x1="175" y1="222" x2="325" y2="208" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#os-req)"/>
  <text x="182" y="204" font-family="sans-serif" font-size="11.5" fill="#8a2b06">大任务</text>

  <!-- ② lead → workers 派单 -->
  <text x="575" y="52" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#8a2b06">② 拆活、派单：目标 ／ 输出格式 ／ 工具与来源 ／ 边界</text>
  <line x1="510" y1="190" x2="636" y2="122" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#os-req)"/>
  <line x1="510" y1="228" x2="636" y2="234" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#os-req)"/>
  <line x1="510" y1="266" x2="636" y2="348" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#os-req)"/>

  <!-- ③ workers → lead 只回结论 -->
  <text x="575" y="428" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f6b3a">③ 各回一条结论，流水不外传</text>
  <line x1="636" y1="140" x2="514" y2="196" stroke="#1f6b3a" stroke-width="1.6" marker-end="url(#os-res)"/>
  <line x1="636" y1="252" x2="514" y2="240" stroke="#1f6b3a" stroke-width="1.6" marker-end="url(#os-res)"/>
  <line x1="636" y1="366" x2="514" y2="278" stroke="#1f6b3a" stroke-width="1.6" marker-end="url(#os-res)"/>

  <!-- ④ lead → 用户 -->
  <text x="252" y="300" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#6c675e">④</text>
  <line x1="325" y1="272" x2="180" y2="256" stroke="#1f6b3a" stroke-width="1.6" marker-end="url(#os-res)"/>
  <text x="186" y="286" font-family="sans-serif" font-size="11.5" fill="#1f6b3a">汇总成一个答案</text>

  <!-- 失败重派 -->
  <line x1="636" y1="300" x2="514" y2="304" stroke="#9b1c1c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#os-warn)"/>
  <text x="575" y="330" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#9b1c1c">失败 → lead 重派、换工具、降级</text>

  <!-- 底注 -->
  <text x="28" y="500" font-family="sans-serif" font-size="11.5" fill="#6c675e">分工换的是上下文：每个 worker 一整个干净的上下文啃自己那块，lead 只装得下结论。</text>
  <text x="28" y="524" font-family="sans-serif" font-size="11.5" fill="#6c675e">派单四件少一件就会出事：写糊了重复劳动，流水全塞回来 lead 第一个被撑死。</text>
</svg>
