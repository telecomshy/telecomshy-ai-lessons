<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="量化省的是搬运量：decode 时间几乎全花在搬运上，所以受益；prefill 是算力受限，所以不受益">
  <rect x="0" y="0" width="720" height="330" fill="#fdfcf8"/>

  <text x="24" y="26" font-family="sans-serif" font-size="13" fill="#1b1a17">量化只改一件事：每个权重占几个字节 —— 于是每吐一个字要搬的货变了</text>

  <!-- 左：prefill -->
  <rect x="24" y="42" width="324" height="250" rx="8" fill="#fff" stroke="#e4ded1" stroke-width="1.5"/>
  <text x="44" y="70" font-family="sans-serif" font-size="13" fill="#8a2b06">读长文 · prefill</text>
  <text x="44" y="90" font-family="sans-serif" font-size="11.5" fill="#6c675e">一次读完整段 · 瓶颈是算力</text>

  <text x="44" y="122" font-family="sans-serif" font-size="11.5" fill="#6c675e">算力</text>
  <rect x="104" y="112" width="224" height="13" rx="6" fill="#8a2b06"/>
  <text x="44" y="152" font-family="sans-serif" font-size="11.5" fill="#6c675e">搬运</text>
  <rect x="104" y="142" width="224" height="13" rx="6" fill="#8a2b06" opacity="0.45"/>

  <text x="44" y="184" font-family="sans-serif" font-size="11.5" fill="#9a938a">压到 4 bit 之后</text>
  <text x="44" y="210" font-family="sans-serif" font-size="11.5" fill="#6c675e">算力</text>
  <rect x="104" y="200" width="224" height="13" rx="6" fill="#8a2b06"/>
  <text x="44" y="240" font-family="sans-serif" font-size="11.5" fill="#6c675e">搬运</text>
  <rect x="104" y="230" width="68" height="13" rx="6" fill="#8a2b06" opacity="0.45"/>

  <text x="44" y="270" font-family="sans-serif" font-size="12" fill="#1b1a17">算力本来就满 → 少搬不省时间</text>
  <text x="44" y="286" font-family="sans-serif" font-size="11.5" fill="#6c675e">实测 923 → 822 t/s（没快）</text>

  <!-- 右：decode -->
  <rect x="372" y="42" width="324" height="250" rx="8" fill="#fff" stroke="#e4ded1" stroke-width="1.5"/>
  <text x="392" y="70" font-family="sans-serif" font-size="13" fill="#8a2b06">写长文 · decode</text>
  <text x="392" y="90" font-family="sans-serif" font-size="11.5" fill="#6c675e">一个字一个字来 · 瓶颈是搬运</text>

  <text x="392" y="122" font-family="sans-serif" font-size="11.5" fill="#6c675e">算力</text>
  <rect x="452" y="112" width="40" height="13" rx="6" fill="#cfc9bf"/>
  <text x="392" y="152" font-family="sans-serif" font-size="11.5" fill="#6c675e">搬运</text>
  <rect x="452" y="142" width="224" height="13" rx="6" fill="#8a2b06"/>

  <text x="392" y="184" font-family="sans-serif" font-size="11.5" fill="#9a938a">压到 4 bit 之后</text>
  <text x="392" y="210" font-family="sans-serif" font-size="11.5" fill="#6c675e">算力</text>
  <rect x="452" y="200" width="40" height="13" rx="6" fill="#cfc9bf"/>
  <text x="392" y="240" font-family="sans-serif" font-size="11.5" fill="#6c675e">搬运</text>
  <rect x="452" y="230" width="68" height="13" rx="6" fill="#8a2b06"/>

  <text x="392" y="270" font-family="sans-serif" font-size="12" fill="#1b1a17">时间几乎全花在搬运上 → 搬少了就快</text>
  <text x="392" y="286" font-family="sans-serif" font-size="11.5" fill="#6c675e">实测 29 → 72 t/s（快 2.5 倍）</text>

  <text x="24" y="314" font-family="sans-serif" font-size="11.5" fill="#6c675e">同一台机器、同一个模型（Llama-3.1-8B），只改存法，其他都不动。数字取自 llama.cpp 官方仓库的实测表。</text>
</svg>