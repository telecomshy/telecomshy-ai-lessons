<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 348" width="820" height="348" role="img" aria-label="RAG 翻车诊断流程图。先把模型看到的那一屏提示词打印出来，看答案在不在里面。不在，就是第一类「该来的没来」，去修检索：切块、嵌入、top-k；在，就是第二类「来了但没用上」，去修组装：顺序、段数、约束。底下注明一次诊断靠眼睛，要看趋势得把检索和生成分开评。">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
    <marker id="arw-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="348" fill="#fdfcf8"/>
  <text x="24" y="28" font-family="sans-serif" font-size="13" fill="#1b1a17">RAG 答错了，先看这一屏，再决定修哪边。</text>

  <!-- 左：打印一屏 -->
  <rect x="24" y="64" width="238" height="150" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="40" y="88" font-family="sans-serif" font-size="12" fill="#6b6560">第一步</text>
  <text x="40" y="112" font-family="sans-serif" font-size="12.5" fill="#1b1a17">把模型看到的那一屏</text>
  <text x="40" y="134" font-family="sans-serif" font-size="12.5" fill="#1b1a17">打印出来，人眼看</text>
  <rect x="40" y="150" width="206" height="18" rx="2" fill="#f4f0e8" stroke="#e4ded1"/>
  <text x="50" y="163" font-family="sans-serif" font-size="10.5" fill="#6b6560">【资料 1】……</text>
  <rect x="40" y="172" width="206" height="18" rx="2" fill="#f4f0e8" stroke="#e4ded1"/>
  <text x="50" y="185" font-family="sans-serif" font-size="10.5" fill="#6b6560">【资料 2】……</text>
  <text x="40" y="205" font-family="sans-serif" font-size="10.5" fill="#6b6560">【问题】……</text>

  <!-- 箭头到判断 -->
  <line x1="266" y1="140" x2="316" y2="140" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 判断菱形 -->
  <polygon points="392,84 470,140 392,196 314,140" fill="#ffffff" stroke="#8a2b06" stroke-width="1.6"/>
  <text x="354" y="134" font-family="sans-serif" font-size="12" fill="#1b1a17">答案在</text>
  <text x="342" y="154" font-family="sans-serif" font-size="12" fill="#1b1a17">这一屏里吗？</text>

  <!-- 上分支：不在 -> 第一类 -->
  <line x1="432" y1="104" x2="512" y2="78" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="438" y="86" font-family="sans-serif" font-size="11" fill="#8a2b06">不在</text>
  <rect x="516" y="48" width="280" height="78" rx="6" fill="#ffffff" stroke="#8a2b06" stroke-width="1.5"/>
  <text x="530" y="72" font-family="sans-serif" font-size="12" fill="#8a2b06">第一类 · 该来的没来</text>
  <text x="530" y="94" font-family="sans-serif" font-size="11.5" fill="#1b1a17">修检索：切块 / 嵌入 / top-k</text>
  <text x="530" y="114" font-family="sans-serif" font-size="10.5" fill="#6b6560">先别动提示词：没有的料，写不进去</text>

  <!-- 下分支：在 -> 第二类 -->
  <line x1="432" y1="176" x2="512" y2="222" stroke="#2f6b4f" stroke-width="1.6" marker-end="url(#arw-green)"/>
  <text x="438" y="208" font-family="sans-serif" font-size="11" fill="#2f6b4f">在</text>
  <rect x="516" y="184" width="280" height="78" rx="6" fill="#ffffff" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="530" y="208" font-family="sans-serif" font-size="12" fill="#2f6b4f">第二类 · 来了但没用上</text>
  <text x="530" y="230" font-family="sans-serif" font-size="11.5" fill="#1b1a17">修组装：顺序 / 段数 / 约束</text>
  <text x="530" y="250" font-family="sans-serif" font-size="10.5" fill="#6b6560">先别怪检索：答案已经在这一屏里</text>

  <!-- 底部收口 -->
  <line x1="24" y1="286" x2="796" y2="286" stroke="#e4ded1"/>
  <text x="24" y="310" font-family="sans-serif" font-size="11.5" fill="#1b1a17">一次诊断靠眼睛；要看趋势，得把检索和生成分开评。</text>
  <text x="24" y="332" font-family="sans-serif" font-size="11" fill="#6b6560">检索侧：Recall@k / Precision@k / Hit rate@k / MRR。生成侧：忠实度 / 相关性。</text>
</svg>
