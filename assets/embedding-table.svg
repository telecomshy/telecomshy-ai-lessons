<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" width="720" height="528" role="img" aria-label="嵌入表长什么样：一张纯数字矩阵，行数等于词表大小 V，每行 d 列。一行就是一个 token 的向量，行号直接就是词表里的编号。图中画出前几行，以及编号 312 那一行被取出来。">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="528" fill="#fdfcf8"/>

  <text x="26" y="30" font-family="sans-serif" font-size="14" fill="#1b1a17">嵌入表（embedding）：一张<tspan font-weight="bold">纯数字矩阵</tspan>，<tspan font-weight="bold">一行 = 一个 token 的向量</tspan></text>

  <g font-family="sans-serif" font-size="12.5" font-weight="bold">
    <text x="120" y="58" fill="#8a2b06">← V 行 ＝ 词表大小（GPT-2 = 50,257）</text>
    <text x="432" y="58" fill="#5d7486">d 列（GPT-2 = 768，这里画 5 列）→</text>
  </g>

  <!-- 列号 -->
  <g font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">
    <text x="176" y="88">1</text><text x="248" y="88">2</text><text x="320" y="88">3</text><text x="392" y="88">4</text><text x="464" y="88">5</text>
    <text x="536" y="88">…</text><text x="608" y="88">d</text>
  </g>

  <!-- 行 1-3 -->
  <g font-family="monospace" font-size="14" fill="#1b1a17">
    <text x="150" y="114" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#6c675e">1</text>
    <rect x="156" y="99" width="472" height="24" rx="3" fill="#fff" stroke="#e4ded1" stroke-width="1.2"/>
    <text x="176" y="117">0.12</text><text x="248" y="117">-0.40</text><text x="320" y="117">0.87</text><text x="392" y="117">0.15</text><text x="464" y="117">-0.22</text>

    <text x="150" y="146" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#6c675e">2</text>
    <rect x="156" y="131" width="472" height="24" rx="3" fill="#fff" stroke="#e4ded1" stroke-width="1.2"/>
    <text x="176" y="149">0.05</text><text x="248" y="149">0.91</text><text x="320" y="149">-0.13</text><text x="392" y="149">0.44</text><text x="464" y="149">0.08</text>

    <text x="150" y="178" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#6c675e">3</text>
    <rect x="156" y="163" width="472" height="24" rx="3" fill="#fff" stroke="#e4ded1" stroke-width="1.2"/>
    <text x="176" y="181">0.33</text><text x="248" y="181">-0.07</text><text x="320" y="181">0.29</text><text x="392" y="181">0.62</text><text x="464" y="181">-0.51</text>
  </g>
  <g font-family="monospace" font-size="14" fill="#6c675e">
    <text x="536" y="117">…</text><text x="536" y="149">…</text><text x="536" y="181">…</text>
  </g>

  <!-- 行 312：高亮 -->
  <text x="150" y="210" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8a2b06">312</text>
  <rect x="156" y="195" width="472" height="24" rx="3" fill="#f4e9e2" stroke="#8a2b06" stroke-width="1.8"/>
  <g font-family="monospace" font-size="14" fill="#1b1a17">
    <text x="176" y="213">1.0</text><text x="248" y="213">0.0</text><text x="320" y="213">0.0</text><text x="392" y="213">0.5</text><text x="464" y="213">-0.2</text>
    <text x="536" y="213" fill="#6c675e">…</text>
  </g>

  <!-- 行 … 与 4021 -->
  <g font-family="monospace" font-size="14" fill="#1b1a17">
    <text x="150" y="246" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#6c675e">…</text>
    <rect x="156" y="231" width="472" height="24" rx="3" fill="#fff" stroke="#e4ded1" stroke-width="1.2"/>
    <text x="176" y="249">-0.18</text><text x="248" y="249">0.26</text><text x="320" y="249">0.71</text><text x="392" y="249">-0.09</text><text x="464" y="249">0.37</text>
    <text x="536" y="249" fill="#6c675e">…</text>

    <text x="150" y="278" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#6c675e">4021</text>
    <rect x="156" y="263" width="472" height="24" rx="3" fill="#fff" stroke="#e4ded1" stroke-width="1.2"/>
    <text x="176" y="281">-0.30</text><text x="248" y="281">0.62</text><text x="320" y="281">0.04</text><text x="392" y="281">-0.77</text><text x="464" y="281">0.15</text>
    <text x="536" y="281" fill="#6c675e">…</text>
  </g>

  <!-- 左侧括号：行号 = 词表编号 -->
  <line x1="112" y1="99" x2="112" y2="287" stroke="#8a2b06" stroke-width="1.6"/>
  <line x1="112" y1="99"  x2="156" y2="99"  stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="112" y1="287" x2="156" y2="287" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text transform="rotate(-90, 78, 193)" x="78" y="193" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8a2b06">行号 = 词表里的编号</text>

  <!-- 取出一行 -->
  <line x1="628" y1="207" x2="686" y2="207" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="628" y="196" font-family="sans-serif" font-size="11.5" fill="#8a2b06">整行照抄</text>
  <text x="628" y="228" font-family="sans-serif" font-size="11.5" fill="#6c675e">768 个数</text>
  <text x="628" y="246" font-family="sans-serif" font-size="11.5" fill="#6c675e">不用算</text>

  <line x1="26" y1="330" x2="694" y2="330" stroke="#e4ded1" stroke-width="1"/>
  <g font-family="sans-serif" font-size="12.5" fill="#3a3730">
    <text x="26" y="356"><tspan font-weight="bold" fill="#8a2b06">① 「哪一行对应哪个字」是词表定的</tspan>，训练前就定死，永不改。</text>
    <text x="26" y="382"><tspan font-weight="bold" fill="#8a2b06">② 「那一行里填什么数」才是训练填的</tspan> —— 一开始是 0 附近的小随机数（怎么长出来的见下一问）。</text>
    <text x="26" y="408">③ 表的大小跟着模型走：GPT-2 小模型 50,257 × 768 ≈ <tspan font-weight="bold">3,860 万</tspan>个数，占整个模型的 1/3。</text>
    <text x="26" y="440" fill="#6c675e">表里只画了 5 列（真实 d = 768），数字也是示意。</text>
    <text x="26" y="464" fill="#6c675e">对比：一次送进模型的那张表是 <tspan font-weight="bold">n 行 × d 列</tspan>，n 是这一次的 token 数 —— 不是这张表。</text>
  </g>
</svg>
