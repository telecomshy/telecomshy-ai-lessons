<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 212" width="720" height="212" role="img" aria-label="开思考之后一次请求的时间线：读完问题后多出一大段思考，多久有反应几乎不变，多久看到答案暴涨">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="212" fill="#fdfcf8"/>

  <text x="24" y="26" font-family="sans-serif" font-size="13" fill="#1b1a17">开思考之后，一次请求的时间线上多出一整段</text>

  <!-- 多久看到答案 -->
  <line x1="24" y1="48" x2="518" y2="48" stroke="#8a2b06" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="528" y="52" font-family="sans-serif" font-size="12" fill="#8a2b06">多久看到答案</text>

  <!-- 多久有反应 -->
  <line x1="24" y1="74" x2="148" y2="74" stroke="#8a2b06" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="158" y="78" font-family="sans-serif" font-size="12" fill="#8a2b06">多久有反应</text>

  <!-- 时间线三段 -->
  <rect x="24" y="92" width="110" height="40" fill="#cfc9bf"/>
  <text x="79" y="117" font-family="sans-serif" font-size="12" fill="#3a3730" text-anchor="middle">读你的问题</text>

  <rect x="134" y="92" width="380" height="40" fill="#8a2b06"/>
  <text x="324" y="117" font-family="sans-serif" font-size="12" fill="#fdfcf8" text-anchor="middle">思考 · 8,000 个 token，一个一个写</text>

  <rect x="514" y="92" width="182" height="40" fill="#8a2b06" opacity="0.35"/>
  <text x="605" y="117" font-family="sans-serif" font-size="12" fill="#1b1a17" text-anchor="middle">回答 · 80 个 token</text>

  <!-- 中间那段的括号 -->
  <line x1="134" y1="146" x2="134" y2="152" stroke="#9a938a" stroke-width="1.2"/>
  <line x1="134" y1="152" x2="514" y2="152" stroke="#9a938a" stroke-width="1.2"/>
  <line x1="514" y1="146" x2="514" y2="152" stroke="#9a938a" stroke-width="1.2"/>
  <text x="324" y="170" font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">多出来的这一段：越宽 = 越慢、越贵</text>

  <text x="24" y="196" font-family="sans-serif" font-size="11.5" fill="#6c675e">思考的第一个字也是立刻冒出来的，所以「多久有反应」几乎不变；暴涨的是「多久看到答案」。</text>
  <text x="24" y="210" font-family="sans-serif" font-size="11.5" fill="#6c675e">而账单和上下文，跟着中间这一段一起走。</text>
</svg>