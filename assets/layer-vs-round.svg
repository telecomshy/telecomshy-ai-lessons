<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680" role="img" aria-label="网格图：横轴是层，同一个字依次走过每一层；纵轴是位置和解码轮次，每一轮新增一行。prefill 一次填满前三行并挑出第一个字，decode 每一轮只填新增的一行">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b3a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="680" fill="#fdfcf8"/>

  <text x="24" y="30" font-family="sans-serif" font-size="14" fill="#1b1a17">「层」和「轮」——垂直的两个方向，别混</text>
  <text x="24" y="50" font-family="sans-serif" font-size="11.5" fill="#6c675e">每一格 = 某个位置在某一层的那根向量。横着走是层，往下加是轮。</text>

  <!-- ===== 列头：层 ===== -->
  <text x="24" y="120" font-family="sans-serif" font-size="11" fill="#8a2b06">位置 ＼ 层</text>
  <g font-family="sans-serif" font-size="11.5" fill="#8a2b06">
    <text x="190" y="120">第 1 层</text>
    <text x="290" y="120">第 2 层</text>
    <text x="390" y="120">第 3 层</text>
    <text x="490" y="120">⋯</text>
    <text x="578" y="120">最后一层</text>
  </g>

  <!-- ===== 行标：位置 / 轮 ===== -->
  <g font-family="serif" font-size="12.5" fill="#1b1a17" text-anchor="end">
    <text x="180" y="168">位置 1「天」</text>
    <text x="180" y="218">位置 2「气」</text>
    <text x="180" y="268">位置 3「很」</text>
  </g>
  <text x="180" y="352" font-family="serif" font-size="12.5" fill="#1f6b3a" text-anchor="end">位置 4「好」</text>

  <!-- ===== 格子 ===== -->
  <g fill="#fff" stroke="#1b1a17" stroke-width="1.3">
    <rect x="190" y="140" width="88" height="42" rx="4"/>
    <rect x="290" y="140" width="88" height="42" rx="4"/>
    <rect x="390" y="140" width="88" height="42" rx="4"/>
    <rect x="490" y="140" width="38" height="42" rx="4" stroke-dasharray="3 3" fill="#f3f0e8"/>
    <rect x="538" y="140" width="88" height="42" rx="4"/>

    <rect x="190" y="190" width="88" height="42" rx="4"/>
    <rect x="290" y="190" width="88" height="42" rx="4"/>
    <rect x="390" y="190" width="88" height="42" rx="4"/>
    <rect x="490" y="190" width="38" height="42" rx="4" stroke-dasharray="3 3" fill="#f3f0e8"/>
    <rect x="538" y="190" width="88" height="42" rx="4"/>

    <rect x="190" y="240" width="88" height="42" rx="4"/>
    <rect x="290" y="240" width="88" height="42" rx="4"/>
    <rect x="390" y="240" width="88" height="42" rx="4"/>
    <rect x="490" y="240" width="38" height="42" rx="4" stroke-dasharray="3 3" fill="#f3f0e8"/>
    <rect x="538" y="240" width="88" height="42" rx="4"/>
  </g>
  <!-- prefill 区块底色 -->
  <rect x="186" y="136" width="444" height="150" rx="6" fill="none" stroke="#8a2b06" stroke-width="1.8"/>

  <!-- ===== 中间那道「挑字」的坎 ===== -->
  <rect x="186" y="292" width="444" height="30" rx="4" fill="#e8f2ec" stroke="#8fbca0" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="408" y="312" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#17512c">从「很」这一行最右边，挑出一个 token → 「好」　（整条流水线唯一真串行的一步）</text>

  <!-- ===== decode 新行 ===== -->
  <g fill="#fff" stroke="#1f6b3a" stroke-width="1.5">
    <rect x="190" y="330" width="88" height="42" rx="4"/>
    <rect x="290" y="330" width="88" height="42" rx="4"/>
    <rect x="390" y="330" width="88" height="42" rx="4"/>
    <rect x="490" y="330" width="38" height="42" rx="4" stroke-dasharray="3 3" fill="#f3f0e8"/>
    <rect x="538" y="330" width="88" height="42" rx="4"/>
  </g>
  <rect x="186" y="326" width="444" height="50" rx="6" fill="none" stroke="#1f6b3a" stroke-width="1.8"/>

  <!-- ===== 纵向箭头：轮 ===== -->
  <line x1="660" y1="140" x2="660" y2="372" stroke="#1f6b3a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="660" y="128" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#1f6b3a">往下 = 轮</text>

  <!-- ===== 两条轴的解释 ===== -->
  <line x1="186" y1="398" x2="626" y2="398" stroke="#8a2b06" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="406" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a2b06">横着走 ＝ 过「层」：同一个字依次过每一层，<tspan font-weight="600">一次要走几十遍</tspan></text>
  <text x="406" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f6b3a">竖着加 ＝ 加「轮」：每走完一遍全部层，<tspan font-weight="600">才多一个字</tspan></text>

  <!-- ===== 两条区块说明 ===== -->
  <text x="186" y="500" font-family="sans-serif" font-size="12" fill="#8a2b06">红框＝<tspan font-weight="600">prefill 第 1 轮</tspan>：这些行<tspan font-weight="600">一次全填满</tspan>，最后只从右下角那一格挑出第一个字</text>
  <text x="186" y="522" font-family="sans-serif" font-size="12" fill="#1f6b3a">绿框＝<tspan font-weight="600">decode 第 2 轮</tspan>：只填<tspan font-weight="600">新增的这一行</tspan>，上面那些行原封不动（它们就是缓存里的 K/V）</text>

  <!-- ===== 一句话 ===== -->
  <rect x="24" y="546" width="672" height="112" rx="6" fill="#fff" stroke="#1b1a17" stroke-width="1.2"/>
  <text x="44" y="574" font-family="sans-serif" font-size="12.5" fill="#1b1a17">所以三个数这么排：</text>
  <text x="44" y="598" font-family="sans-serif" font-size="12" fill="#3a3730">· <tspan font-weight="600">一次请求</tspan> ＝ 1 次 prefill（把所有行填满）＋ 若干次 decode（一轮加一行）</text>
  <text x="44" y="620" font-family="sans-serif" font-size="12" fill="#3a3730">· <tspan font-weight="600">一轮</tspan> ＝ 一个字<tspan font-weight="600">走完全部层</tspan>　·　<tspan font-weight="600">一层</tspan> ＝ 注意力 → 残差 → FFN → 残差</text>
  <text x="44" y="644" font-family="sans-serif" font-size="11" fill="#6c675e">原始论文只有 6 层，今天的大模型是几十层——所以"走一遍"听着像一步，其实是几十步。</text>
</svg>
