<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" width="720" height="950" role="img" aria-label="跟踪「气」这一行往下走的过程：每一层里它算出 k、v、q，算出注意力结果，注意力结果被加回这一行，这一行就成为下一层的输入；下一个层里，别的位置读的就是这一行">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="950" fill="#fdfcf8"/>

  <text x="24" y="28" font-family="sans-serif" font-size="14" fill="#1b1a17">跟踪「气」这一行往下走</text>
  <text x="24" y="48" font-family="sans-serif" font-size="11.5" fill="#6c675e">它自己算出来的注意力，会变成下一层的输入——不是终点，是原料。</text>

  <!-- ===== 起点：嵌入表查出来的那一行 ===== -->
  <rect x="110" y="66" width="500" height="52" rx="8" fill="#fff" stroke="#1b1a17" stroke-width="1.5"/>
  <text x="130" y="88" font-family="sans-serif" font-size="11.5" fill="#8a2b06">起点</text>
  <text x="130" y="108" font-family="serif" font-size="13.5" fill="#1b1a17">「气」这一行向量 h　——　刚从嵌入表里查出来，还没混进任何上下文</text>

  <line x1="360" y1="118" x2="360" y2="146" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== 第 1 层 ===== -->
  <rect x="110" y="150" width="500" height="212" rx="8" fill="#fff" stroke="#1b1a17" stroke-width="1.5"/>
  <text x="130" y="174" font-family="sans-serif" font-size="12.5" fill="#1b1a17">第 1 层　（这一层里，别的位置跟它互不等待）</text>
  <text x="130" y="200" font-family="sans-serif" font-size="12" fill="#8a2b06">从这一行投影 → k、v　　顺手存进货架</text>
  <text x="130" y="224" font-family="sans-serif" font-size="12" fill="#8a2b06">从这一行投影 → q</text>
  <text x="130" y="248" font-family="sans-serif" font-size="12" fill="#1f6b3a" font-weight="600">q 去比 k、按比重取 v　→　注意力结果 a</text>
  <text x="130" y="278" font-family="sans-serif" font-size="12" fill="#3a3730">残差：h ＋ a　　← 注意力结果被"加回"这一行</text>
  <text x="130" y="302" font-family="sans-serif" font-size="12" fill="#3a3730">过 FFN，再残差　→　这一行变成了新的一根（记作 h″）</text>
  <text x="130" y="330" font-family="sans-serif" font-size="11" fill="#6c675e">注意：它跟「天」「很」在这一层里没有互相依赖，所以三个位置是一起算的。</text>
  <text x="130" y="350" font-family="sans-serif" font-size="11" fill="#6c675e">但「气」自己算出来的东西，已经被写回「气」这一行了。</text>

  <line x1="360" y1="362" x2="360" y2="392" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== 第 2 层（重点）===== -->
  <rect x="110" y="396" width="500" height="150" rx="8" fill="#f4e9e2" stroke="#8a2b06" stroke-width="2"/>
  <text x="130" y="420" font-family="sans-serif" font-size="12.5" fill="#1b1a17">第 2 层　（它读的是 h″，已经不是第 0 层那根了）</text>
  <text x="130" y="448" font-family="sans-serif" font-size="12" fill="#1f6b3a" font-weight="600">从 h″ 投影 → 新的 k、v　★</text>
  <text x="130" y="472" font-family="sans-serif" font-size="12" fill="#8a2b06">从 h″ 投影 → 新的 q</text>
  <text x="130" y="500" font-family="sans-serif" font-size="11.5" fill="#3a3730">所以这一层的 k、v，已经带着"气看过天"这个信息了。</text>
  <text x="130" y="524" font-family="sans-serif" font-size="11.5" fill="#3a3730">一层传一格。传到最后，就是模型对整句话的理解。</text>

  <!-- 侧边标注：位置 3 读的就是它 -->
  <line x1="610" y1="448" x2="672" y2="448" stroke="#1f6b3a" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="676" y="440" font-family="sans-serif" font-size="11" fill="#1f6b3a">「很」</text>
  <text x="676" y="456" font-family="sans-serif" font-size="11" fill="#1f6b3a">读它</text>

  <line x1="360" y1="546" x2="360" y2="576" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== 省略 ===== -->
  <rect x="200" y="580" width="320" height="52" rx="8" fill="#f3f0e8" stroke="#e4ded1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="612" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#6c675e">……　同样的过程，重复几十层　……</text>

  <line x1="360" y1="632" x2="360" y2="662" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== 最后一层 ===== -->
  <rect x="110" y="666" width="500" height="120" rx="8" fill="#fff" stroke="#1b1a17" stroke-width="1.5"/>
  <text x="130" y="690" font-family="sans-serif" font-size="12.5" fill="#1b1a17">最后一层</text>
  <text x="130" y="714" font-family="sans-serif" font-size="12" fill="#3a3730">「气」这一行又被改写了一次</text>
  <text x="130" y="738" font-family="sans-serif" font-size="12" fill="#3a3730">但预测下一个字只用「很」那一行——「气」的最终结果作废</text>
  <text x="130" y="766" font-family="sans-serif" font-size="11" fill="#6c675e">它在前面那些层里被用掉，是"传话"；到最后一层就走完了。</text>

  <line x1="360" y1="786" x2="360" y2="816" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== 出口 ===== -->
  <rect x="200" y="820" width="320" height="58" rx="8" fill="#f4e9e2" stroke="#8a2b06" stroke-width="1.5"/>
  <text x="360" y="846" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a2b06">拿「很」那一行去打分</text>
  <text x="360" y="868" text-anchor="middle" font-family="serif" font-size="14" fill="#1b1a17">挑出下一个字</text>

  <!-- ===== 一句话 ===== -->
  <rect x="24" y="900" width="672" height="34" rx="6" fill="#e8f2ec" stroke="#8fbca0" stroke-width="1"/>
  <text x="360" y="922" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17512c">所以：每个位置算出来的注意力不是终点，是下一层的原料——一个都省不掉。</text>
</svg>
