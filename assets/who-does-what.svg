<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" width="720" height="528" role="img" aria-label="归属图：从上到下四层，你的 harness、API 网关、推理引擎、模型权重，每层右边列出它真正干的活，模型那层只交出下一张分数表">
  <rect x="0" y="0" width="720" height="528" fill="#fdfcf8"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c675e"/></marker>
  </defs>
  <text x="20" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1a17">你发出一个请求，穿过四层</text>
  <path d="M46,54 L46,494" stroke="#e4ded1" stroke-width="1.2" fill="none"/>
  <rect x="66" y="52" width="284" height="92" rx="6" fill="none" stroke="#8a2b06" stroke-width="1.6"/>
  <text x="80" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8a2b06">1. 你的 harness（跑 agent 的那段程序）</text>
  <text x="82" y="96" font-family="sans-serif" font-size="11.5" fill="#1b1a17">拼提示词 · 装工具 · 管上下文</text>
  <text x="82" y="113" font-family="sans-serif" font-size="11.5" fill="#1b1a17">决定停在哪一步 · 失败怎么重试</text>
  <rect x="66" y="170" width="284" height="78" rx="6" fill="none" stroke="#7a6a52" stroke-width="1.6"/>
  <text x="80" y="194" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a6a52">2. API 网关</text>
  <text x="82" y="214" font-family="sans-serif" font-size="11.5" fill="#1b1a17">鉴权 · 限流 · 计费</text>
  <text x="82" y="231" font-family="sans-serif" font-size="11.5" fill="#1b1a17">把请求转给哪台机器</text>
  <rect x="66" y="274" width="284" height="116" rx="6" fill="none" stroke="#8a2b06" stroke-width="1.6"/>
  <text x="80" y="298" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8a2b06">3. 推理引擎（vLLM / SGLang / 服务端）</text>
  <text x="82" y="318" font-family="sans-serif" font-size="11.5" fill="#1b1a17">排队 · 拼车 · 复用缓存</text>
  <text x="82" y="335" font-family="sans-serif" font-size="11.5" fill="#1b1a17">从分表里挑字 · 按语法划掉非法字</text>
  <text x="82" y="352" font-family="sans-serif" font-size="11.5" fill="#1b1a17">小模型打草稿、大模型一次验收</text>
  <path d="M350,332 L392,332" stroke="#6c675e" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="304" font-family="sans-serif" font-size="11.5" fill="#1b1a17">这些全是这一层的活，</text>
  <text x="400" y="322" font-family="sans-serif" font-size="11.5" fill="#1b1a17">权重一个字节都不管</text>
  <rect x="66" y="416" width="284" height="78" rx="6" fill="none" stroke="#1f6b3a" stroke-width="1.6"/>
  <text x="80" y="440" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f6b3a">4. 模型权重（训练学出来的那份参数）</text>
  <text x="82" y="460" font-family="sans-serif" font-size="11.5" fill="#1b1a17">只干一件：把已收到的这些字，算成下一张分数表</text>
  <path d="M350,455 L392,455" stroke="#6c675e" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="446" font-family="sans-serif" font-size="11.5" fill="#1b1a17">交出分表就下班</text>
  <text x="400" y="464" font-family="sans-serif" font-size="11.5" fill="#1b1a17">后面全不是它干的</text>
  <text x="20" y="514" font-family="sans-serif" font-size="11.5" fill="#6c675e">先问一句：这句话是我的程序说的、网关说的、引擎说的，还是权重说的？</text>
</svg>