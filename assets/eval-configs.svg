<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" width="820" height="336" role="img" aria-label="一次对照实验的形状。左边是同一套 20 道题（单跳 10、多跳 5、否定 5），中间是三个切块配置（切小 45 字、切中 90 字、切大 180 字），只有块大小这一个变量在动；右边是三张成绩单（Recall@3 与 MRR）。底下注明：嵌入、top-k、检索器、问题集全程不动，k 钉死，三张成绩单的差距就是这批文档对切块大小的答案。">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="336" fill="#fdfcf8"/>
  <text x="24" y="28" font-family="sans-serif" font-size="13" fill="#1b1a17">对照实验：同一套题，只动「切块大小」这一个变量。</text>

  <!-- 左：同一套题 -->
  <rect x="24" y="72" width="212" height="176" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="40" y="96" font-family="sans-serif" font-size="12.5" fill="#1b1a17">同一套 20 题</text>
  <rect x="40" y="110" width="180" height="20" rx="2" fill="#f4f0e8" stroke="#e4ded1"/>
  <text x="50" y="124" font-family="sans-serif" font-size="10.5" fill="#6b6560">单跳 × 10</text>
  <rect x="40" y="136" width="180" height="20" rx="2" fill="#f4f0e8" stroke="#e4ded1"/>
  <text x="50" y="150" font-family="sans-serif" font-size="10.5" fill="#6b6560">多跳 × 5</text>
  <rect x="40" y="162" width="180" height="20" rx="2" fill="#f4f0e8" stroke="#e4ded1"/>
  <text x="50" y="176" font-family="sans-serif" font-size="10.5" fill="#6b6560">否定 × 5（标空）</text>
  <text x="40" y="204" font-family="sans-serif" font-size="10.5" fill="#6b6560">标「答案需要哪几条制度」，</text>
  <text x="40" y="222" font-family="sans-serif" font-size="10.5" fill="#6b6560">不标「第几块」——块号随配置变。</text>

  <!-- 三条箭头 -->
  <line x1="240" y1="120" x2="288" y2="100" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="240" y1="160" x2="288" y2="160" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="240" y1="200" x2="288" y2="220" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 中：三个配置 -->
  <text x="294" y="60" font-family="sans-serif" font-size="11.5" fill="#8a2b06">三个切块配置，其他全程不动</text>
  <rect x="294" y="72" width="180" height="54" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="310" y="94" font-family="sans-serif" font-size="12" fill="#1b1a17">切小 · 45 字</text>
  <text x="310" y="114" font-family="sans-serif" font-size="10.5" fill="#6b6560">14 块</text>
  <rect x="294" y="134" width="180" height="54" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="310" y="156" font-family="sans-serif" font-size="12" fill="#1b1a17">切中 · 90 字</text>
  <text x="310" y="176" font-family="sans-serif" font-size="10.5" fill="#6b6560">7 块</text>
  <rect x="294" y="196" width="180" height="54" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="310" y="218" font-family="sans-serif" font-size="12" fill="#1b1a17">切大 · 180 字</text>
  <text x="310" y="238" font-family="sans-serif" font-size="10.5" fill="#6b6560">4 块</text>

  <!-- 右：三张成绩单 -->
  <line x1="478" y1="100" x2="526" y2="100" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="478" y1="160" x2="526" y2="160" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="478" y1="222" x2="526" y2="222" stroke="#8a2b06" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="530" y="72" width="266" height="54" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="546" y="94" font-family="sans-serif" font-size="12" fill="#1b1a17">成绩单一：Recall@3 = 0.77</text>
  <text x="546" y="114" font-family="sans-serif" font-size="10.5" fill="#6b6560">MRR = 0.80，4 道题没全中</text>
  <rect x="530" y="134" width="266" height="54" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="546" y="156" font-family="sans-serif" font-size="12" fill="#1b1a17">成绩单二：Recall@3 = 0.87</text>
  <text x="546" y="176" font-family="sans-serif" font-size="10.5" fill="#6b6560">MRR = 0.90，也漏——输在同一刀上</text>
  <rect x="530" y="196" width="266" height="54" rx="6" fill="#ffffff" stroke="#c9c2b6"/>
  <text x="546" y="218" font-family="sans-serif" font-size="12" fill="#1b1a17">成绩单三：Recall@3 = 1.00</text>
  <text x="546" y="238" font-family="sans-serif" font-size="10.5" fill="#6b6560">MRR = 1.00——检索侧全绿，还没完</text>

  <!-- 底部收口 -->
  <line x1="24" y1="278" x2="796" y2="278" stroke="#e4ded1"/>
  <text x="24" y="302" font-family="sans-serif" font-size="11.5" fill="#1b1a17">三张成绩单的差距，就是这批文档对「切多大」的答案。</text>
  <text x="24" y="322" font-family="sans-serif" font-size="11" fill="#6b6560">嵌入 / top-k / 检索器 / 问题集全程不动；k 钉死。检索侧筛完档，生成侧拿判官再比一轮。</text>
</svg>
