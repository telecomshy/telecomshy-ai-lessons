<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" aria-label="老师那张概率表里，尾部四根很小的柱子带着「哪个错更像对」的排序；只给正确答案时，尾部全是零，排序信息一点不剩">
  <rect x="0" y="0" width="720" height="296" fill="#fdfcf8"/>

  <text x="24" y="26" font-family="sans-serif" font-size="13" fill="#1b1a17">教小模型时，你给它什么，它就只能学到什么</text>

  <!-- 第一行：老师那张表 -->
  <text x="24" y="56" font-family="sans-serif" font-size="12" fill="#1b1a17">老师那张表</text>
  <line x1="24" y1="62" x2="696" y2="62" stroke="#e4ded1" stroke-width="1"/>

  <rect x="160" y="64" width="90" height="36" fill="#8a2b06"/>
  <text x="205" y="58" font-family="sans-serif" font-size="11.5" fill="#8a2b06" text-anchor="middle">60%</text>

  <rect x="262" y="89" width="90" height="11" fill="#8a2b06" opacity="0.7"/>
  <text x="307" y="83" font-family="sans-serif" font-size="11.5" fill="#8a2b06" text-anchor="middle">18%</text>

  <rect x="364" y="94" width="90" height="6" fill="#8a2b06" opacity="0.7"/>
  <text x="409" y="88" font-family="sans-serif" font-size="11.5" fill="#8a2b06" text-anchor="middle">10%</text>

  <rect x="466" y="96" width="90" height="4" fill="#8a2b06" opacity="0.7"/>
  <text x="511" y="90" font-family="sans-serif" font-size="11.5" fill="#8a2b06" text-anchor="middle">7%</text>

  <rect x="568" y="97" width="90" height="3" fill="#8a2b06" opacity="0.7"/>
  <text x="613" y="91" font-family="sans-serif" font-size="11.5" fill="#8a2b06" text-anchor="middle">5%</text>

  <text x="160" y="120" font-family="sans-serif" font-size="11.5" fill="#6c675e">晴</text>
  <text x="262" y="120" font-family="sans-serif" font-size="11.5" fill="#6c675e">雨</text>
  <text x="364" y="120" font-family="sans-serif" font-size="11.5" fill="#6c675e">风</text>
  <text x="466" y="120" font-family="sans-serif" font-size="11.5" fill="#6c675e">云</text>
  <text x="568" y="120" font-family="sans-serif" font-size="11.5" fill="#6c675e">霜</text>

  <!-- 尾部的括号：被搬过去的就是这一行 -->
  <line x1="262" y1="130" x2="262" y2="136" stroke="#8a2b06" stroke-width="1.2"/>
  <line x1="262" y1="136" x2="658" y2="136" stroke="#8a2b06" stroke-width="1.2"/>
  <line x1="658" y1="130" x2="658" y2="136" stroke="#8a2b06" stroke-width="1.2"/>
  <text x="460" y="154" font-family="sans-serif" font-size="12" fill="#8a2b06" text-anchor="middle">雨 &gt; 风 &gt; 云 &gt; 霜　—— 老师「要是错了更可能错成谁」的判断</text>

  <line x1="24" y1="168" x2="696" y2="168" stroke="#e4ded1" stroke-width="1"/>

  <!-- 第二行：只给正确答案 -->
  <text x="24" y="192" font-family="sans-serif" font-size="12" fill="#1b1a17">只给正确答案</text>

  <rect x="160" y="216" width="90" height="36" fill="#cfc9bf"/>
  <text x="205" y="210" font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">100%</text>

  <rect x="262" y="248" width="90" height="4" fill="#cfc9bf"/>
  <text x="307" y="242" font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">0%</text>

  <rect x="364" y="248" width="90" height="4" fill="#cfc9bf"/>
  <text x="409" y="242" font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">0%</text>

  <rect x="466" y="248" width="90" height="4" fill="#cfc9bf"/>
  <text x="511" y="242" font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">0%</text>

  <rect x="568" y="248" width="90" height="4" fill="#cfc9bf"/>
  <text x="613" y="242" font-family="sans-serif" font-size="11.5" fill="#6c675e" text-anchor="middle">0%</text>

  <text x="160" y="270" font-family="sans-serif" font-size="11.5" fill="#6c675e">晴</text>
  <text x="262" y="270" font-family="sans-serif" font-size="11.5" fill="#9b1c1c">雨</text>
  <text x="364" y="270" font-family="sans-serif" font-size="11.5" fill="#9b1c1c">风</text>
  <text x="466" y="270" font-family="sans-serif" font-size="11.5" fill="#9b1c1c">云</text>
  <text x="568" y="270" font-family="sans-serif" font-size="11.5" fill="#9b1c1c">霜</text>

  <text x="24" y="288" font-family="sans-serif" font-size="11.5" fill="#9b1c1c">四个 0% 之间排不出先后——上面那条排序，在这一栏里一点都没剩下。</text>
</svg>