<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" width="720" height="386" role="img" aria-label="第 1 轮 prefill：三个 token 向量各自都预测了下一个字，只有最后一个的预测被取走">
  <rect x="0" y="0" width="720" height="386" fill="#fdfcf8"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
    <marker id="arGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c675e"/>
    </marker>
    <marker id="arDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a396"/>
    </marker>
  </defs>

  <!-- 外框：prefill 这一轮 -->
  <rect x="16" y="16" width="688" height="364" rx="8" fill="none" stroke="#8a2b06" stroke-width="2" stroke-dasharray="7 4"/>
  <rect x="30" y="8" width="150" height="18" fill="#fdfcf8"/>
  <text x="38" y="21" font-family="sans-serif" font-size="12.5" fill="#8a2b06" font-weight="600">第 1 轮 · prefill</text>

  <!-- 左栏标题：输入 -->
  <text x="60" y="58" font-family="sans-serif" font-size="11.5" fill="#6c675e">你的输入</text>
  <text x="60" y="76" font-family="sans-serif" font-size="11" fill="#6c675e">（每行一个 token 向量）</text>

  <!-- 三个 token 行，纵向排列 -->
  <rect x="40" y="92" width="150" height="52" rx="7" fill="#fff" stroke="#e4ded1" stroke-width="1.5"/>
  <text x="62" y="124" font-family="serif" font-size="21" fill="#1b1a17">你</text>
  <text x="96" y="123" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <rect x="40" y="156" width="150" height="52" rx="7" fill="#fff" stroke="#e4ded1" stroke-width="1.5"/>
  <text x="62" y="188" font-family="serif" font-size="21" fill="#1b1a17">是</text>
  <text x="86" y="187" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <rect x="40" y="220" width="150" height="52" rx="7" fill="#fff" stroke="#8a2b06" stroke-width="1.8"/>
  <text x="62" y="252" font-family="serif" font-size="21" fill="#1b1a17">谁</text>
  <text x="86" y="251" font-family="sans-serif" font-size="10.5" fill="#8a2b06">向量</text>

  <!-- 每行都往下预测：三个箭头，从框底垂下 -->
  <line x1="115" y1="148" x2="115" y2="180" stroke="#a9a396" stroke-width="1.6" marker-end="url(#arDim)"/>
  <line x1="115" y1="212" x2="115" y2="244" stroke="#a9a396" stroke-width="1.6" marker-end="url(#arDim)"/>
  <line x1="115" y1="276" x2="115" y2="308" stroke="#8a2b06" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 预测结果列 -->
  <text x="238" y="58" font-family="sans-serif" font-size="11.5" fill="#6c675e">各自都预测了下一个字</text>

  <rect x="206" y="182" width="104" height="44" rx="7" fill="#f6f4ee" stroke="#ddd8cc" stroke-width="1.4"/>
  <text x="236" y="211" font-family="serif" font-size="19" fill="#8d887c">是</text>

  <rect x="206" y="246" width="104" height="44" rx="7" fill="#f6f4ee" stroke="#ddd8cc" stroke-width="1.4"/>
  <text x="236" y="275" font-family="serif" font-size="19" fill="#8d887c">谁</text>

  <rect x="206" y="310" width="104" height="44" rx="7" fill="#f4e9e2" stroke="#8a2b06" stroke-width="1.8"/>
  <text x="236" y="339" font-family="serif" font-size="19" fill="#8a2b06">我</text>

  <!-- 前两个：丢弃 -->
  <text x="272" y="200" font-family="sans-serif" font-size="11.5" fill="#8d887c">✕ 丢弃</text>
  <text x="272" y="264" font-family="sans-serif" font-size="11.5" fill="#8d887c">✕ 丢弃</text>

  <!-- 第三个：取走，往下接打分 -->
  <text x="272" y="331" font-family="sans-serif" font-size="11.5" fill="#8a2b06" font-weight="600">✓ 取走</text>

  <line x1="258" y1="358" x2="258" y2="374" stroke="#8a2b06" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 分隔与说明 -->
  <line x1="360" y1="52" x2="360" y2="360" stroke="#e4ded1" stroke-width="1.2"/>

  <text x="388" y="118" font-family="sans-serif" font-size="11.5" fill="#6c675e">每一行都往下一个字预测了一遍，</text>
  <text x="388" y="137" font-family="sans-serif" font-size="11.5" fill="#6c675e">三个字都真的算了。</text>

  <text x="388" y="206" font-family="sans-serif" font-size="12.5" fill="#8a2b06" font-weight="600">但只有最后一个被取走</text>
  <text x="388" y="229" font-family="sans-serif" font-size="11.5" fill="#6c675e">前两个的预测作废——它们后面</text>
  <text x="388" y="248" font-family="sans-serif" font-size="11.5" fill="#6c675e">没有内容可接。</text>

  <text x="388" y="316" font-family="sans-serif" font-size="11.5" fill="#6c675e">被取走的那个还要走完打分、</text>
  <text x="388" y="335" font-family="sans-serif" font-size="11.5" fill="#6c675e">百分比、挑这三步，</text>
  <text x="388" y="354" font-family="sans-serif" font-size="11.5" fill="#6c675e">才是返回给你的那个字。</text>
</svg>
