<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-label="每个 token 都往右预测下一个字：你的输入是三个 token 向量，各自都预测了一遍，只有最后一个的预测被取走，再经打分、百分比、挑选，变成一个编号返回给你">
  <rect x="0" y="0" width="720" height="366" fill="#fdfcf8"/>

  <defs>
    <marker id="arGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c675e"/>
    </marker>
    <marker id="arDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a396"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2b06"/>
    </marker>
  </defs>

  <!-- 左栏：你的输入 -->
  <text x="30" y="40" font-family="sans-serif" font-size="11.5" fill="#6c675e">你的输入</text>
  <text x="30" y="58" font-family="sans-serif" font-size="11" fill="#6c675e">（每行一个 token 向量）</text>

  <!-- 三个 token 行，纵向排列 -->
  <rect x="26" y="76" width="132" height="46" rx="7" fill="#fff" stroke="#e4ded1" stroke-width="1.5"/>
  <text x="50" y="106" font-family="serif" font-size="21" fill="#1b1a17">你</text>
  <text x="82" y="105" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <rect x="26" y="140" width="132" height="46" rx="7" fill="#fff" stroke="#e4ded1" stroke-width="1.5"/>
  <text x="50" y="170" font-family="serif" font-size="21" fill="#1b1a17">是</text>
  <text x="82" y="169" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <rect x="26" y="204" width="132" height="46" rx="7" fill="#fff" stroke="#8a2b06" stroke-width="1.8"/>
  <text x="50" y="234" font-family="serif" font-size="21" fill="#1b1a17">谁</text>
  <text x="82" y="233" font-family="sans-serif" font-size="10.5" fill="#8a2b06">向量</text>

  <!-- 从左到右：每行各预测下一个字 -->
  <!-- 从左到右：每行各预测下一个字。箭头代表走完全部层，不只是一步注意力 -->
  <text x="195" y="70" font-family="sans-serif" font-size="10.5" fill="#6c675e" text-anchor="middle">走完所有层</text>
  <line x1="160" y1="99"  x2="230" y2="99"  stroke="#a9a396" stroke-width="1.6" marker-end="url(#arDim)"/>
  <line x1="160" y1="163" x2="230" y2="163" stroke="#a9a396" stroke-width="1.6" marker-end="url(#arDim)"/>
  <line x1="160" y1="227" x2="230" y2="227" stroke="#8a2b06" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 中栏：预测结果，与左栏逐行对齐 -->
  <text x="238" y="58" font-family="sans-serif" font-size="11" fill="#6c675e">各自都预测了下一个字</text>

  <rect x="238" y="76" width="104" height="46" rx="7" fill="#f6f4ee" stroke="#ddd8cc" stroke-width="1.4"/>
  <text x="266" y="106" font-family="serif" font-size="20" fill="#8d887c">是</text>
  <text x="296" y="105" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <rect x="238" y="140" width="104" height="46" rx="7" fill="#f6f4ee" stroke="#ddd8cc" stroke-width="1.4"/>
  <text x="266" y="170" font-family="serif" font-size="20" fill="#8d887c">谁</text>
  <text x="296" y="169" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <rect x="238" y="204" width="104" height="46" rx="7" fill="#f4e9e2" stroke="#8a2b06" stroke-width="1.8"/>
  <text x="266" y="234" font-family="serif" font-size="20" fill="#8a2b06">我</text>
  <text x="296" y="233" font-family="sans-serif" font-size="10.5" fill="#a9a396">向量</text>

  <!-- 前两个丢弃 -->
  <text x="354" y="104" font-family="sans-serif" font-size="11.5" fill="#8d887c">✕ 丢弃</text>
  <text x="354" y="168" font-family="sans-serif" font-size="11.5" fill="#8d887c">✕ 丢弃</text>

  <!-- 只有「我」往下：一条长箭头，穿过打分/百分比/挑选，落到「我的编号」 -->
  <text x="354" y="232" font-family="sans-serif" font-size="11.5" fill="#8a2b06" font-weight="600">✓ 取走</text>

  <line x1="290" y1="256" x2="290" y2="312" stroke="#8a2b06" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="304" y="278" font-family="sans-serif" font-size="11" fill="#6c675e">打分 → 百分比 → 挑选</text>

  <rect x="222" y="316" width="136" height="34" rx="7" fill="#fff" stroke="#8a2b06" stroke-width="1.8"/>
  <text x="242" y="338" font-family="serif" font-size="16" fill="#8a2b06">我的编号</text>
  <text x="366" y="338" font-family="sans-serif" font-size="10.5" fill="#6c675e">返回给你</text>

  <!-- 分隔与说明 -->
  <line x1="430" y1="42" x2="430" y2="346" stroke="#e4ded1" stroke-width="1.2"/>

  <text x="456" y="106" font-family="sans-serif" font-size="11.5" fill="#6c675e">每一行都往右预测了一遍，</text>
  <text x="456" y="125" font-family="sans-serif" font-size="11.5" fill="#6c675e">三个字都真的算了。</text>

  <text x="456" y="176" font-family="sans-serif" font-size="12.5" fill="#8a2b06" font-weight="600">但只有最后一个被取走</text>
  <text x="456" y="199" font-family="sans-serif" font-size="11.5" fill="#6c675e">前两个的预测作废——它们后面</text>
  <text x="456" y="218" font-family="sans-serif" font-size="11.5" fill="#6c675e">没有内容可接。</text>

  <text x="456" y="278" font-family="sans-serif" font-size="11.5" fill="#6c675e">取走的那个还要经打分、百分比、</text>
  <text x="456" y="297" font-family="sans-serif" font-size="11.5" fill="#6c675e">挑选，才变成一个编号交出去。</text>
  <text x="456" y="316" font-family="sans-serif" font-size="11.5" fill="#6c675e">下一轮拿这个编号重新查嵌入表。</text>
</svg>